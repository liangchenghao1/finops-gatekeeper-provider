---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-gatekeeper-provider
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-gatekeeper-provider
  template:
    metadata:
      labels:
        app: finops-gatekeeper-provider
    spec:
      containers:
        - image: registry-cn-hangzhou.ack.aliyuncs.com/acs/finops-gatekeeper-provider:v0.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: ALIBABACLOUD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: alibabacloud-credentials
                  key: accessKeyId
            - name: ALIBABACLOUD_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: alibabacloud-credentials
                  key: accessKeySecret
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          name: finops-gatekeeper-provider
          ports:
            - containerPort: 8090
              protocol: TCP
      restartPolicy: Always
      volumes:
        - name: tls
          secret:
            secretName: finops-external-data-secret
        - name: config
          configMap:
            name: finops-gatekeeper-provider-config
      nodeSelector:
        kubernetes.io/os: linux