apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-gatekeeper-provider-role
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - serviceaccounts
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-gatekeeper-provider-role-binding
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: finops-gatekeeper-provider-role
subjects:
  - kind: ServiceAccount
    name: finops-gatekeeper-provider-sa
    namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-gatekeeper-provider-sa
  namespace: kube-system 